[package]
name = "wrcli"
version = "0.1.0"
edition = "2024"
description = "A cobra/viper-inspired CLI framework library for Rust"

[features]
default     = ["toml-config", "json-config"]
toml-config = ["dep:toml"]
json-config = ["dep:serde_json"]
yaml-config = ["dep:serde_yml"]

[dependencies]
indexmap    = "2"
shellexpand = "3"

# Optional config-format backends
toml       = { version = "0.8", optional = true }
serde_json = { version = "1",   optional = true }
serde_yml  = { version = "0.0", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
