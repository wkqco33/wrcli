[package]
name = "wrcli"
version = "0.1.0"
edition = "2024"
description = "A Rust CLI framework inspired by Cobra and Viper, with typed flags, nested commands, layered configuration, shell completion, and terminal styling"
license = "MIT"
repository = "https://github.com/wkqco33/wrcli"
homepage = "https://github.com/wkqco33/wrcli"
documentation = "https://docs.rs/wrcli"
readme = "README.md"
keywords = ["cli", "cobra", "viper", "flag", "config"]
categories = ["command-line-interface", "config"]
exclude = ["AGENTS.md", "CLAUDE.md", ".github"]

[features]
default     = ["toml-config", "json-config"]
toml-config = ["dep:toml"]
json-config = ["dep:serde_json"]
yaml-config = ["dep:noyalib"]

[dependencies]
indexmap    = "2.14"
log         = "0.4"
shellexpand = "3"

# Optional config-format backends
toml       = { version = "0.8", optional = true }
serde_json = { version = "1",   optional = true }
noyalib    = { version = "0.0", optional = true }

[dev-dependencies]
assert_cmd = "2.2"
env_logger = "0.11"
predicates = "3"
